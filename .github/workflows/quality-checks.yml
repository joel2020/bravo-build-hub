name: Quality Checks

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Unit tests
        run: PORT=4174 pnpm --filter @workspace/bravo-mechanical run test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Audit local landing content
        run: pnpm --filter @workspace/bravo-mechanical run audit:local-content

      - name: Mutation-test local landing content
        run: pnpm --filter @workspace/bravo-mechanical run test:local-content

      - name: Build workspace
        run: PORT=4174 pnpm run build

      - name: Smoke test Bravo app
        run: pnpm --filter @workspace/bravo-mechanical run test:e2e

      - name: Check all local landing pages
        run: pnpm --filter @workspace/bravo-mechanical run test:local-pages

      - name: Check React and crawler semantic parity
        run: PORT=4174 pnpm --filter @workspace/bravo-mechanical run test:local-parity

      - name: Check service bundle boundary
        run: pnpm --filter @workspace/bravo-mechanical run test:bundle

      - name: Validate CI acceptance path
        run: pnpm --filter @workspace/bravo-mechanical run test:ci-config
