kind = "web"
previewPath = "/backlink-agent/"
title = "Bravo Backlink Agent"
version = "1.0.0"
id = "artifacts/backlink-agent"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/backlink-agent/" ]
localPort = 19380

[services.development]
run = "pnpm --filter @workspace/backlink-agent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/backlink-agent", "run", "build" ]
publicDir = "artifacts/backlink-agent/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19380"
BASE_PATH = "/backlink-agent/"
